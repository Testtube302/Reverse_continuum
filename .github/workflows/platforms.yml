name: Native platform checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxi-dev libgl1-mesa-dev
      - name: Rust toolchain
        run: rustup update stable
      - name: Native tests
        run: cargo +stable test --locked -- --test-threads=1
      - name: Static checks
        run: cargo +stable clippy --locked --all-targets
      - name: Install helper build dependencies
        run: python -m pip install -r tools/package/requirements.txt
      - name: Package client and helper without private code or game assets
        run: python tools/package/build.py --output target/packages/AIContinuum-${{ runner.os }}-${{ runner.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: AIContinuum-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/packages/*.zip
            target/packages/*.tar.gz
          if-no-files-found: error
