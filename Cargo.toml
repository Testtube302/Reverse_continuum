[package]
name = "aicontinuum"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "AIContinuum"
path = "src/main.rs"

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png", "gif"] }
macroquad = { version = "0.4.16", features = ["audio"] }
miniz_oxide = "0.9.1"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2.190"
